services:
  - type: web
    name: uae-shield-dashboard
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: SECRET_KEY
        generateValue: true
      - key: REQUIRE_LOGIN
        value: "true"
      - key: ADMIN_PASSWORD
        value: "change_me_123"
      - key: DATABASE_PATH
        value: /var/data/uae_shield.db
      - key: DISCORD_WEBHOOK_URL
        sync: false
      - key: AUTO_SEND_DASHBOARD_ON_CHANGE
        value: "false"
      - key: APPROVER_POSITIONS
        value: مسؤول الإدارة العليا,مسؤول الادارة العليا
      - key: PROMOTION_ALLOWED_POSITIONS
        value: مسؤول الإدارة العليا,مسؤول الادارة العليا,مسؤول الاداريين
      - key: LEAVE_ALLOWED_POSITIONS
        value: مسؤول الإدارة العليا,مسؤول الادارة العليا,مسؤول الاداريين,نائب مسؤول الاداريين
    disk:
      name: uae-shield-data
      mountPath: /var/data
      sizeGB: 1
