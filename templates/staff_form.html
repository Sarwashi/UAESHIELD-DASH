{% extends "layout.html" %}
{% block content %}
<h1>{{ 'تعديل إداري' if row else 'إضافة إداري' }}</h1>
<form method="post" class="form panel">
  <label>Discord ID</label><input name="discord_id" required value="{{ row.discord_id if row else '' }}">
  <label>ID اللاعب</label><input name="player_id" value="{{ row.player_id if row else '' }}">
  <label>يوزر ديسكورد</label><input name="discord_user" value="{{ row.discord_user if row else '' }}">
  <label>الاسم</label><input name="name" required value="{{ row.name if row else '' }}">

  <label>الرتبة</label>
  <select name="rank">{% for x in RANKS %}<option value="{{ x }}" {% if row and row.rank==x %}selected{% endif %}>{{ x }}</option>{% endfor %}</select>

  <label>المنصب</label>
  <select name="position">
    <option value="">بدون منصب</option>
    {% for x in POSITIONS %}<option value="{{ x }}" {% if row and row.position==x %}selected{% endif %}>{{ x }}</option>{% endfor %}
  </select>

  <label>الحالة</label>
  <select name="status">{% for x in STATUSES %}<option value="{{ x }}" {% if row and row.status==x %}selected{% endif %}>{{ x }}</option>{% endfor %}</select>

  <label>تاريخ الانضمام</label><input type="date" name="join_date" value="{{ row.join_date if row else '' }}">
  <label>سبب عدم التفاعل / الباند</label><input name="inactive_reason" value="{{ row.inactive_reason if row and row.inactive_reason else '' }}">
  <label>ملاحظات</label><textarea name="notes">{{ row.notes if row else '' }}</textarea>
  <button class="btn">حفظ</button>
</form>
{% endblock %}
